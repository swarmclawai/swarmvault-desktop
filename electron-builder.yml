appId: ai.swarmvault.desktop
productName: SwarmVault
copyright: "Copyright 2024-2026 SwarmVault"

directories:
  app: .release-app
  output: release
  buildResources: resources
afterPack: ./scripts/repack-app-asar.cjs

files:
  - out/**/*
  - node_modules/**/*
  - package.json

asarUnpack:
  - "node_modules/@swarmvaultai/**"
  - "node_modules/@vscode/tree-sitter-wasm/wasm/**"
  - "node_modules/tree-sitter-wasms/out/**"
  - "node_modules/pdfjs-dist/**"

mac:
  category: public.app-category.developer-tools
  artifactName: "SwarmVault-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.icns

win:
  artifactName: "SwarmVault-windows-${arch}.${ext}"
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  forceCodeSigning: false

nsis:
  oneClick: true
  perMachine: false
  allowElevation: true

linux:
  artifactName: "SwarmVault-linux-${arch}.${ext}"
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  icon: resources/icon.png
  category: Development

publish:
  provider: github
