name: Windows Packaged Smoke

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows-packaged-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Package Windows build
        run: pnpm package:win

      - name: Smoke packaged Windows artifact
        run: node ./scripts/smoke-packaged-app.mjs release/win-unpacked/resources/app.asar
